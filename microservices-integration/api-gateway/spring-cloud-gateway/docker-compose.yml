version: '3.7'

services:
  gateway-service:
    build:
      context: ./gateway-service
    ports:
      - "8080:8080"
    networks:
      - my-network
    depends_on:
      - http-response-simulator

  http-response-simulator:
    build:
      context: ./http-response-simulator
    ports:
      - "9001:9001"
    networks:
      - my-network

networks:
  my-network:
    driver: bridge
